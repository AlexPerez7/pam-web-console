# --- HTTP :80 — acceso por túnel SSH (ssh -L 8080:127.0.0.1:8080) ---
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location / { try_files $uri /index.html; }

    location /api/ {
        # Resolución dinámica de `api` (DNS interno de Docker, 127.0.0.11):
        # con un host fijo en proxy_pass, nginx resuelve la IP UNA vez al
        # arrancar y, si el contenedor `api` se recrea (reload, crash) con
        # otra IP, sigue apuntando a la vieja -> 502 en todo /api/ hasta
        # reiniciar `web`. Pasó en el server el 2026-09-28 (el login mostraba
        # "No se pudo conectar con PAM Web Console"). Con una variable, nginx vuelve a
        # resolver el nombre según `valid`. El rewrite quita el prefijo
        # /api/ (lo que antes hacía la "/" final de `http://api:8000/`).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pam_api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $pam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (no $proxy_add_x_forwarded_for): pisa cualquier
        # X-Forwarded-For que mande el cliente, para que no pueda falsear
        # su IP ante uvicorn (--forwarded-allow-ips, ver entrypoint.sh).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 600s (no 120s): /credentials-backup/export recupera el secreto de
        # CADA cuenta del tenant (miles) antes de responder — puede tardar
        # varios minutos. El resto de la API responde en milisegundos, un
        # timeout más largo no les cambia nada.
        proxy_read_timeout 600s;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header content-type text/plain;
    }
}

# --- HTTPS :443 — acceso por hostname (pam.<dominio>) ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri /index.html; }

    location /api/ {
        # Resolución dinámica de `api` (DNS interno de Docker, 127.0.0.11):
        # con un host fijo en proxy_pass, nginx resuelve la IP UNA vez al
        # arrancar y, si el contenedor `api` se recrea (reload, crash) con
        # otra IP, sigue apuntando a la vieja -> 502 en todo /api/ hasta
        # reiniciar `web`. Pasó en el server el 2026-09-28 (el login mostraba
        # "No se pudo conectar con PAM Web Console"). Con una variable, nginx vuelve a
        # resolver el nombre según `valid`. El rewrite quita el prefijo
        # /api/ (lo que antes hacía la "/" final de `http://api:8000/`).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pam_api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $pam_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr (no $proxy_add_x_forwarded_for): pisa cualquier
        # X-Forwarded-For que mande el cliente, para que no pueda falsear
        # su IP ante uvicorn (--forwarded-allow-ips, ver entrypoint.sh).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 600s (no 120s): /credentials-backup/export recupera el secreto de
        # CADA cuenta del tenant (miles) antes de responder — puede tardar
        # varios minutos. El resto de la API responde en milisegundos, un
        # timeout más largo no les cambia nada.
        proxy_read_timeout 600s;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header content-type text/plain;
    }
}
