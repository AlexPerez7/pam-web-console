# Headers de seguridad, incluidos en cada server block. Ver
# docs/specs/hardening-pre-escritura.md §R6.
#
# CSP: la SPA se sirve del mismo origen; todo (JS, CSS, fuentes) es local.
#  - style-src 'unsafe-inline': React usa `style={{}}` en la grilla/virtualizer.
#  - img-src data:: el QR del TOTP es un data: URI SVG.
#  - img-src blob:: LogoSettings (pages/Tenants.tsx) arma un blob: URL en
#    memoria con la imagen que devuelve GET /tenants/{id}/logo (un <img src>
#    no puede mandar el Bearer token, así que no alcanza con apuntarlo
#    directo al endpoint) para la vista previa del logo del cliente en el
#    reporte ITR. Mismo gotcha que media-src más abajo (2026-09-18).
#  - connect-src 'self': la API va por /api en el mismo origen (proxy).
#  - media-src blob:: RecordingPlayerSection.tsx arma un blob: URL en memoria
#    con el MP4 que devuelve /recordings/{id}/play/mp4 (nunca queda en disco
#    ni en un origen ajeno) para el <video> nativo. Sin media-src, cae al
#    default-src 'self', que bloquea blob: — visto real contra Globex
#    (2026-09-16).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
