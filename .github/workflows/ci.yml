name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historia completa para el escaneo en push
      - name: gitleaks (secret scanning)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: py_compile
        run: python -m compileall -q app alembic
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest -m "not contract"
      - name: pip-audit (CVEs de dependencias)
        # Sin ignores desde que starlette pasó a 1.7.0 (2026-10-05): los 5 CVEs
        # que se ignoraban eran de starlette <1.3.1. Ver docs/security.md.
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npx tsc --noEmit
      - name: build
        run: npm run build
      - name: npm audit (CVEs de dependencias)
        run: npm audit --omit=dev --audit-level=high
